name: Regression Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run regression tests
        id: run_tests
        continue-on-error: true
        env:
          TEST_BASE_URL: https://the-quad-ek8.vercel.app
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASS: ${{ secrets.TEST_ADMIN_PASS }}
          TEST_MEMBER_EMAIL: ${{ secrets.TEST_MEMBER_EMAIL }}
          TEST_MEMBER_PASS: ${{ secrets.TEST_MEMBER_PASS }}
        run: |
          npm test --reporter=json > tests/results.json 2>&1 || true
          npm test 2>&1 | tee tests/run.log || true

      - name: Parse and upload results to Supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e "
          const fs = require('fs');
          const log = fs.existsSync('tests/run.log') ? fs.readFileSync('tests/run.log','utf8') : '';
          const lines = log.split('\n');
          const tests = [];
          let passed = 0, failed = 0;
          for (const line of lines) {
            const ok = line.match(/✓\s+\d+\s+\[chromium\].*?›\s+(.*?)\s+\((\d+(?:\.\d+)?(?:ms|s))\)/);
            const fail = line.match(/✘\s+\d+\s+\[chromium\].*?›\s+(.*?)\s+\(/);
            if (ok) { tests.push({ name: ok[1].trim(), status:'passed', duration: ok[2] }); passed++; }
            if (fail) { tests.push({ name: fail[1].trim(), status:'failed', duration: null }); failed++; }
          }
          const payload = {
            run_at: new Date().toISOString(),
            passed, failed,
            total: passed + failed,
            tests: JSON.stringify(tests),
            trigger: process.env.GITHUB_EVENT_NAME || 'manual'
          };
          const https = require('https');
          const body = JSON.stringify(payload);
          const url = new URL(process.env.SUPABASE_URL + '/rest/v1/test_runs');
          const req = https.request(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': process.env.SUPABASE_SERVICE_ROLE_KEY,
              'Authorization': 'Bearer ' + process.env.SUPABASE_SERVICE_ROLE_KEY,
              'Prefer': 'return=minimal'
            }
          }, res => { res.resume(); console.log('Uploaded:', res.statusCode); });
          req.write(body); req.end();
          "

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/report/
          retention-days: 30
